openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Overview metrics and activity feed
  - name: activities
    description: Training activity management
  - name: sessions
    description: Training session management
  - name: agents
    description: Agent records and profiles
  - name: coverage
    description: Agent training coverage
  - name: head-count
    description: Current and historical agent population
  - name: updates
    description: Operational updates
  - name: workload
    description: Trainer workload summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get overview dashboard
      responses:
        "200":
          description: Overview dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List training activities
      responses:
        "200":
          description: Training activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingActivity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Create a training activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingActivityInput"
      responses:
        "201":
          description: Created training activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingActivity"
  /activities/{id}:
    get:
      operationId: getActivity
      tags: [activities]
      summary: Get a training activity
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Training activity details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingActivityDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update a training activity
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingActivityUpdate"
      responses:
        "200":
          description: Updated training activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingActivity"
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List training sessions
      responses:
        "200":
          description: Training sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSessionInput"
      responses:
        "201":
          description: Created training session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSessionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a training session
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
  /sessions/{id}/attendance:
    put:
      operationId: replaceSessionAttendance
      tags: [sessions]
      summary: Replace attendance for a session
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: Updated attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents/bulk:
    post:
      operationId: bulkCreateAgents
      tags: [agents]
      summary: Create multiple agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAgentInput"
      responses:
        "201":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAgentResult"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      operationId: bulkUpdateAgents
      tags: [agents]
      summary: Update multiple agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAgentUpdate"
      responses:
        "200":
          description: Updated agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    delete:
      operationId: bulkDeleteAgents
      tags: [agents]
      summary: Delete or archive multiple agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAgentDelete"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAgentDeleteResult"
  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete or archive an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Delete or archive result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeleteResult"
  /coverage:
    get:
      operationId: listCoverage
      tags: [coverage]
      summary: List coverage records
      responses:
        "200":
          description: Agent coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverageRecord"
  /head-count:
    get:
      operationId: getHeadCount
      tags: [head-count]
      summary: Get head count summary
      responses:
        "200":
          description: Head count summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadCountSummary"
  /updates:
    get:
      operationId: listUpdates
      tags: [updates]
      summary: List operational updates
      responses:
        "200":
          description: Operational updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingUpdate"
    post:
      operationId: createUpdate
      tags: [updates]
      summary: Create an operational update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingUpdateInput"
      responses:
        "201":
          description: Created operational update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingUpdate"
  /updates/{id}:
    patch:
      operationId: updateTrainingUpdate
      tags: [updates]
      summary: Update an operational update
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingUpdateUpdate"
      responses:
        "200":
          description: Updated operational update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingUpdate"
  /workload:
    get:
      operationId: listWorkload
      tags: [workload]
      summary: Get trainer workload
      responses:
        "200":
          description: Trainer workload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainerWorkload"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicting agent identifier
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    LOB:
      type: string
      enum: [C-Side, BD-Side, DC&Calls-Side, Kfood, CM]
    ActivityType:
      type: string
      enum: [Refresher, Process Update, SOP Update, QA Refresher, Soft Skills, Product Update, Task Review, Mandatory Training, Other]
    ActivityStatus:
      type: string
      enum: [Draft, Active, In Progress, Completed, Archived]
    SessionStatus:
      type: string
      enum: [Planned, In Progress, Completed, Cancelled]
    SessionType:
      type: string
      enum: [Refresher, Update Session, Soft Skills, QA Coaching, New Joiner Support, Process Update, Other]
    AgentStatus:
      type: string
      enum: [Active, Inactive, Transferred, On Leave]
    AttendanceStatus:
      type: string
      enum: [Attended, Absent, Removed, Cancelled]
    UpdateStatus:
      type: string
      enum: [Open, In Progress, Completed, Archived]
    Trainer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
      required: [id, name, role]
    Agent:
      type: object
      properties:
        id: { type: integer }
        hrId: { type: string }
        mis: { type: string }
        name: { type: string }
        lob:
          $ref: "#/components/schemas/LOB"
        employmentStatus:
          $ref: "#/components/schemas/AgentStatus"
        dateAdded:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        archivedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, hrId, mis, name, lob, employmentStatus, dateAdded, notes, archivedAt]
    AgentInput:
      type: object
      required: [hrId, mis, name, lob, employmentStatus]
      properties:
        hrId: { type: string, minLength: 1 }
        mis: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        lob: { $ref: "#/components/schemas/LOB" }
        employmentStatus: { $ref: "#/components/schemas/AgentStatus" }
        dateAdded: { type: string, format: date }
        notes: { type: string }
    AgentUpdate:
      type: object
      properties:
        hrId: { type: string, minLength: 1 }
        mis: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        lob: { $ref: "#/components/schemas/LOB" }
        employmentStatus: { $ref: "#/components/schemas/AgentStatus" }
        notes: { type: string }
    BulkAgentInput:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AgentInput"
    BulkAgentResult:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        warnings:
          type: array
          items: { type: string }
      required: [created, warnings]
    BulkAgentUpdate:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer }
        lob:
          $ref: "#/components/schemas/LOB"
        employmentStatus:
          $ref: "#/components/schemas/AgentStatus"
    BulkAgentDelete:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer }
    AgentDeleteResult:
      type: object
      properties:
        mode: { type: string, enum: [deleted, archived] }
        agent:
          $ref: "#/components/schemas/Agent"
      required: [mode]
    BulkAgentDeleteResult:
      type: object
      properties:
        deleted: { type: integer }
        archived: { type: integer }
      required: [deleted, archived]
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            totalSessions: { type: integer }
            lastTrainingDate: { type: ["string", "null"], format: date }
            pendingActivities: { type: integer }
            completedActivities: { type: integer }
            history:
              type: array
              items:
                type: object
                properties:
                  activityName: { type: string }
                  sessionId: { type: string }
                  trainer: { type: string }
                  lob: { $ref: "#/components/schemas/LOB" }
                  date: { type: string, format: date }
                  result: { type: ["number", "null"] }
                  attendanceStatus: { $ref: "#/components/schemas/AttendanceStatus" }
                  coverageStatus: { type: string }
                required: [activityName, sessionId, trainer, lob, date, result, attendanceStatus, coverageStatus]
          required: [totalSessions, lastTrainingDate, pendingActivities, completedActivities, history]
    Attendance:
      type: object
      properties:
        id: { type: integer }
        agentId: { type: integer }
        hrId: { type: string }
        mis: { type: string }
        agentName: { type: string }
        lob: { $ref: "#/components/schemas/LOB" }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
        result:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
      required: [id, agentId, hrId, mis, agentName, lob, status, result, notes]
    AttendanceInput:
      type: object
      required: [agentId, status]
      properties:
        agentId: { type: integer }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
        result: { type: ["number", "null"] }
        notes: { type: string }
    TrainingActivity:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { $ref: "#/components/schemas/ActivityType" }
        scope:
          type: array
          items: { $ref: "#/components/schemas/LOB" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ActivityStatus" }
        description: { type: ["string", "null"] }
        requiredAgents: { type: integer }
        coveredAgents: { type: integer }
        pendingAgents: { type: integer }
        coveragePercent: { type: number }
        sessionsCount: { type: integer }
        lastSessionDate: { type: ["string", "null"], format: date }
      required: [id, name, type, scope, startDate, endDate, status, description, requiredAgents, coveredAgents, pendingAgents, coveragePercent, sessionsCount, lastSessionDate]
    TrainingActivityInput:
      type: object
      required: [name, type, scope, startDate, endDate, status]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/ActivityType" }
        scope:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LOB" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ActivityStatus" }
        description: { type: string }
        requiredAgentIds:
          type: array
          items: { type: integer }
    TrainingActivityUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/ActivityType" }
        scope:
          type: array
          items: { $ref: "#/components/schemas/LOB" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ActivityStatus" }
        description: { type: string }
    TrainingActivityDetail:
      allOf:
        - $ref: "#/components/schemas/TrainingActivity"
        - type: object
          properties:
            sessions:
              type: array
              items: { $ref: "#/components/schemas/TrainingSession" }
            covered:
              type: array
              items: { $ref: "#/components/schemas/CoverageRecord" }
            pending:
              type: array
              items: { $ref: "#/components/schemas/Agent" }
          required: [sessions, covered, pending]
    TrainingSession:
      type: object
      properties:
        id: { type: integer }
        sessionId: { type: string }
        activityId: { type: integer }
        activityName: { type: string }
        sessionDate: { type: string, format: date }
        trainer: { $ref: "#/components/schemas/Trainer" }
        lob: { $ref: "#/components/schemas/LOB" }
        type: { $ref: "#/components/schemas/SessionType" }
        topic: { type: ["string", "null"] }
        durationMinutes: { type: integer }
        status: { $ref: "#/components/schemas/SessionStatus" }
        attendanceCount: { type: integer }
        notes: { type: ["string", "null"] }
      required: [id, sessionId, activityId, activityName, sessionDate, trainer, lob, type, topic, durationMinutes, status, attendanceCount, notes]
    TrainingSessionInput:
      type: object
      required: [activityId, sessionDate, trainerId, lob, type, durationMinutes, status]
      properties:
        activityId: { type: integer }
        sessionDate: { type: string, format: date }
        trainerId: { type: integer }
        lob: { $ref: "#/components/schemas/LOB" }
        type: { $ref: "#/components/schemas/SessionType" }
        topic: { type: string }
        durationMinutes: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/SessionStatus" }
        notes: { type: string }
    TrainingSessionUpdate:
      type: object
      properties:
        sessionDate: { type: string, format: date }
        trainerId: { type: integer }
        lob: { $ref: "#/components/schemas/LOB" }
        type: { $ref: "#/components/schemas/SessionType" }
        topic: { type: string }
        durationMinutes: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/SessionStatus" }
        notes: { type: string }
    TrainingSessionDetail:
      allOf:
        - $ref: "#/components/schemas/TrainingSession"
        - type: object
          properties:
            attendance:
              type: array
              items: { $ref: "#/components/schemas/Attendance" }
          required: [attendance]
    CoverageRecord:
      type: object
      properties:
        id: { type: integer }
        agentId: { type: integer }
        hrId: { type: string }
        mis: { type: string }
        agentName: { type: string }
        lob: { $ref: "#/components/schemas/LOB" }
        activityId: { type: integer }
        activityName: { type: string }
        trainer: { $ref: "#/components/schemas/Trainer" }
        status:
          type: string
          enum: [Covered, Pending, No Training Record]
        result: { type: ["number", "null"] }
        lastSessionDate: { type: ["string", "null"], format: date }
        sessionId: { type: ["string", "null"] }
      required: [id, agentId, hrId, mis, agentName, lob, activityId, activityName, status]
    HeadCountRow:
      type: object
      properties:
        lob: { $ref: "#/components/schemas/LOB" }
        active: { type: integer }
        inactive: { type: integer }
        transferred: { type: integer }
        onLeave: { type: integer }
        total: { type: integer }
      required: [lob, active, inactive, transferred, onLeave, total]
    HeadCountSummary:
      type: object
      properties:
        totalActive: { type: integer }
        inactive: { type: integer }
        transferred: { type: integer }
        onLeave: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/HeadCountRow" }
        snapshots:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              totalActive: { type: integer }
            required: [month, totalActive]
      required: [totalActive, inactive, transferred, onLeave, rows, snapshots]
    TrainingUpdate:
      type: object
      properties:
        id: { type: integer }
        updateId: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        scope:
          type: array
          items: { $ref: "#/components/schemas/LOB" }
        releaseDate: { type: string, format: date }
        deadline: { type: ["string", "null"], format: date }
        status: { $ref: "#/components/schemas/UpdateStatus" }
        linkedActivities:
          type: array
          items: { type: integer }
        notes: { type: ["string", "null"] }
        coveragePercent: { type: number }
      required: [id, updateId, title, description, scope, releaseDate, deadline, status, linkedActivities, notes, coveragePercent]
    TrainingUpdateInput:
      type: object
      required: [title, scope, releaseDate, status]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        scope:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LOB" }
        releaseDate: { type: string, format: date }
        deadline: { type: string }
        status: { $ref: "#/components/schemas/UpdateStatus" }
        linkedActivities:
          type: array
          items: { type: integer }
        notes: { type: string }
    TrainingUpdateUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        scope:
          type: array
          items: { $ref: "#/components/schemas/LOB" }
        releaseDate: { type: string, format: date }
        deadline: { type: string }
        status: { $ref: "#/components/schemas/UpdateStatus" }
        linkedActivities:
          type: array
          items: { type: integer }
        notes: { type: string }
    TrainerWorkload:
      type: object
      properties:
        trainer: { $ref: "#/components/schemas/Trainer" }
        completedSessions: { type: integer }
        uniqueAgentsCovered: { type: integer }
        totalAttendance: { type: integer }
        trainingHours: { type: number }
        activeSessions: { type: integer }
        sessionsThisMonth: { type: integer }
        activitiesParticipated: { type: integer }
      required: [trainer, completedSessions, uniqueAgentsCovered, totalAttendance, trainingHours, activeSessions, sessionsThisMonth, activitiesParticipated]
    Dashboard:
      type: object
      properties:
        completedSessions: { type: integer }
        agentsCovered: { type: integer }
        pendingAgents: { type: integer }
        activeHeadCount: { type: integer }
        activeActivities: { type: integer }
        activeUpdates: { type: integer }
        coveragePercent: { type: number }
        trainingHours: { type: number }
        coverageByLob:
          type: array
          items:
            type: object
            properties:
              lob: { $ref: "#/components/schemas/LOB" }
              covered: { type: integer }
              required: { type: integer }
